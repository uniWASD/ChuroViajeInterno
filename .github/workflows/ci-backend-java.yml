name: CI Backend Java

on:
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - '04_imp/backend_java/**'
      - '04_imp/motor_cpp/**'
      - '.github/workflows/ci-backend-java.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_imp/backend_java

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # El núcleo C++ se compila para que corran las pruebas del backend con el núcleo real
      # (CP-99, MotorDeRutas y la ruta). Usan la red de prueba del repositorio; la red real
      # de Tarija no está en el repositorio (D-33) y su prueba se salta.
      - name: Compilar el núcleo C++
        working-directory: 04_imp/motor_cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target motor_nucleo --parallel

      - name: Compilar y ejecutar pruebas (JUnit 5)
        env:
          MOTOR_PATH: ${{ github.workspace }}/04_imp/motor_cpp/build/motor_nucleo
          RED_VIAL_PATH: ${{ github.workspace }}/04_imp/motor_cpp/tests/datos/red_irregular.json
        run: ./mvnw -B clean test