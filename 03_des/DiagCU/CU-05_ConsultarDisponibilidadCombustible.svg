69 28,107.7969 C32,111.7969 35,111.7969 39,111.7969 " fill="#FFFFFF" style="stroke:#2F5D8A;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="66" x="6" y="148.3638">Conductor</text></g><!--entity Backend--><g id="elem_Backend"><ellipse cx="612.5" cy="99.4297" fill="#FFFFFF" rx="16" ry="16" style="stroke:#2F5D8A;stroke-width:0.5;"/><path d="M612.5,119.4297 C616.5,119.4297 619.5,119.4297 623.5,115.4297 C631.5,115.4297 639.5,123.4297 639.5,131.4297 L639.5,135.4297 C639.5,139.4297 635.5,143.4297 631.5,143.4297 L593.5,143.4297 C589.5,143.4297 585.5,139.4297 585.5,135.4297 L585.5,131.4297 C585.5,123.4297 593.5,115.4297 601.5,115.4297 C605.5,119.4297 608.5,119.4297 612.5,119.4297 " fill="#FFFFFF" style="stroke:#2F5D8A;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="85" x="570" y="155.9966">Backend Java</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="67" x="579" y="79.8638">&#171;sistema&#187;</text></g><!--link Conductor to CU05--><g id="link_Conductor_CU05"><path d="M72.06,113.2969 C103.68,113.2969 147.96,113.2969 194.96,113.2969 " fill="none" id="Conductor-to-CU05" style="stroke:#2F5D8A;stroke-width:1.0;"/><polygon fill="#2F5D8A" points="200.96,113.2969,191.96,109.2969,195.96,113.2969,191.96,117.2969,200.96,113.2969" style="stroke:#2F5D8A;stroke-width:1.0;"/></g><!--link CU05 to Backend--><g id="link_CU05_Backend"><path d="M440.29,113.2969 C486.28,113.2969 529.9,113.2969 563.83,113.2969 " fill="none" id="CU05-to-Backend" style="stroke:#2F5D8A;stroke-width:1.0;"/><polygon fill="#2F5D8A" points="569.83,113.2969,560.83,109.2969,564.83,113.2969,560.83,117.2969,569.83,113.2969" style="stroke:#2F5D8A;stroke-width:1.0;"/></g><rect fill="#FFF8E1" height="93.8125" id="_legend" rx="7.5" ry="7.5" style="stroke:#C9A227;stroke-width:1.0;" width="412" x="118" y="181.2969"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="369" x="123" y="197.4355">El backend entrega el dato m&#225;s reciente de cada surtidor,</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="363" x="123" y="211.4043">por tipo de combustible: monitoreo de WhatsApp (CU-06),</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="402" x="123" y="225.373">consulta a ANH (CU-09) o confirmaci&#243;n de conductores (HU-12),</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="124" x="123" y="239.3418">indicando el origen.</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="340" x="123" y="253.3105">Tipos: Gasolina, Diesel, Gasolina Premium y Diesel ULS</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="272" x="123" y="267.2793">("Desconocido" si un mensaje no lo indica).</text><!--SRC=[dLJRRXCn47tVhnYb3oHIGfD5BKr0bTAqeKLGLRI15oGqMKyIWzTUR6zBGNnClw6Va1zZxCqLMYJOXsWpnpDppdZdF871gDNUwy70Q5SgZnQEfIkCbcEff401WXZBnwNpSgmeUGB3ahId7hJJJvQ-GWjEN46PdCWCCpc_rp43dN7XPUGCr4EB3c1irMrmYJFdIgvmrMgdNQZl78JOExgMRfcVcHbPqfb4gBVtTpljtRITxZTwuAI6_iKPq3TFLkCBc4Gs3ZxCqBj-KS1ja2BAp1jBhia9b1UMe30Ml2nCLNsb1-eP-lcTCjE8X1EkyNIBpbMhqzc7UlfiWmOtpyZYediJ-kUdbSmk9oUA9Xwy0IkdCmz2MigyD3fnNwGkq68EReR2t4WzXGagHnk8e0doFGoDzkUO4zIEwJE-B-4IjQizVEvIVYVeFDi02yo-u9Gk_Iqh3DrHJzLc5mpZgM2y8MVoJR1qbA4Z-940776bgJMb5WEZU8Gx9_rXEZmAYB62x2AQ3lUE3_eSxLjhRhQ3FpTAhxXKnHyi4IL5QcEZn5PwfFsNr3_O3kEpLKCR_uWqFdbmqlcz-A3RJzFdMoKU4Ba65Kr9Y__ei50UBpFbVecNdeVmZ_kPL3EghPQW1kZMAx640xL0ypLUOpon3BnywQJpbEFXOPAihwlMBzHgmT_Exw-bWi6ijEQznC-yHVdyNfJgz-rgrE8SbXzKBMhvg1_Jyb5lYwceZzfxOHeh2T1g7LRHy1F_BSY7pOl37nllJSwTJnIC5y9uKIrD4KY1G5xEV7xdmlSemmP7tYWGN6cz5COsEVaHo-X1pfI3lKHaPJnn__SR8JDR26JFst06C06OI9klZJ9RUnNKJqUjJXeBI2rusbgOGDUmZv1-ok6hO4yzUCNkggJ69i-F7AdcA