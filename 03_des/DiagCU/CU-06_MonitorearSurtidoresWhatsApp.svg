<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="422px" preserveAspectRatio="none" style="width:1092px;height:422px;background:#FFFFFF;" version="1.1" viewBox="0 0 1092 422" width="1092px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="428" x="325" y="22.9951">CU-06: Monitorear Estado de Surtidores v&#237;a WhatsApp</text><!--cluster Backend de ChuroViaje (m?dulo de combustible\ny servicio de WhatsApp/LLM)--><g id="cluster_Backend de ChuroViaje (m&#243;dulo de combustible\ny servicio de WhatsApp/LLM)"><rect fill="none" height="135" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:1.0;" width="374" x="194" y="81.8628"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="358" x="202" y="95.9297">Backend de ChuroViaje (m&#243;dulo de combustible</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="214" x="274" y="111.0625">y servicio de WhatsApp/LLM)</text></g><g id="elem_CU06"><ellipse cx="380.7939" cy="165.9643" fill="#EAF2FB" rx="121.7939" ry="35.1015" style="stroke:#2F5D8A;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="40" x="360.7939" y="153.332">CU-06</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="137" x="312.2939" y="168.4648">Monitorear Estado de</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="156" x="302.7939" y="183.5976">Surtidores v&#237;a WhatsApp</text></g><!--entity Monitor--><g id="elem_Monitor"><ellipse cx="76.5" cy="144.4956" fill="#FFFFFF" rx="16" ry="16" style="stroke:#2F5D8A;stroke-width:0.5;"/><path d="M76.5,164.4956 C80.5,164.4956 83.5,164.4956 87.5,160.4956 C95.5,160.4956 103.5,168.4956 103.5,176.4956 L103.5,180.4956 C103.5,184.4956 99.5,188.4956 95.5,188.4956 L57.5,188.4956 C53.5,188.4956 49.5,184.4956 49.5,180.4956 L49.5,176.4956 C49.5,168.4956 57.5,160.4956 65.5,160.4956 C69.5,164.4956 72.5,164.4956 76.5,164.4956 " fill="#FFFFFF" style="stroke:#2F5D8A;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="141" x="6" y="201.0625">Proceso de monitoreo</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="83" x="6" y="216.1953">(autom&#225;tico)</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="67" x="43" y="124.9297">&#171;proceso&#187;</text></g><!--entity WA--><g id="elem_WA"><ellipse cx="1018" cy="76.4956" fill="#FFFFFF" rx="16" ry="16" style="stroke:#2F5D8A;stroke-width:0.5;"/><path d="M1018,96.4956 C1022,96.4956 1025,96.4956 1029,92.4956 C1037,92.4956 1045,100.4956 1045,108.4956 L1045,112.4956 C1045,116.4956 1041,120.4956 1037,120.4956 L999,120.4956 C995,120.4956 991,116.4956 991,112.4956 L991,108.4956 C991,100.4956 999,92.4956 1007,92.4956 C1011,96.4956 1014,96.4956 1018,96.4956 " fill="#FFFFFF" style="stroke:#2F5D8A;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="134" x="951" y="133.0625">Grupos de WhatsApp</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="89" x="951" y="148.1953">monitoreados</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="121" x="957.5" y="56.9297">&#171;sistema externo&#187;</text></g><!--entity LLM--><g id="elem_LLM"><ellipse cx="1018" cy="218.9956" fill="#FFFFFF" rx="16" ry="16" style="stroke:#2F5D8A;stroke-width:0.5;"/><path d="M1018,238.9956 C1022,238.9956 1025,238.9956 1029,234.9956 C1037,234.9956 1045,242.9956 1045,250.9956 L1045,254.9956 C1045,258.9956 1041,262.9956 1037,262.9956 L999,262.9956 C995,262.9956 991,258.9956 991,254.9956 L991,250.9956 C991,242.9956 999,234.9956 1007,234.9956 C1011,238.9956 1014,238.9956 1018,238.9956 " fill="#FFFFFF" style="stroke:#2F5D8A;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="117" x="959.5" y="275.5625">Proveedor del LLM</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="121" x="957.5" y="199.4297">&#171;sistema externo&#187;</text></g><!--link Monitor to CU06--><g id="link_Monitor_CU06"><path d="M147.28,165.8628 C180.43,165.8628 215.03,165.8628 252.97,165.8628 " fill="none" id="Monitor-to-CU06" style="stroke:#2F5D8A;stroke-width:1.0;"/><polygon fill="#2F5D8A" points="258.97,165.8628,249.97,161.8628,253.97,165.8628,249.97,169.8628,258.97,165.8628" style="stroke:#2F5D8A;stroke-width:1.0;"/></g><!--link CU06 to WA--><g id="link_CU06_WA"><path d="M488.79,149.4528 C519.49,145.0328 553.03,140.4728 584,136.8628 C713.7,121.7228 859.8575,109.6901 944.8875,103.1901 " fill="none" id="CU06-to-WA" style="stroke:#2F5D8A;stroke-width:1.0;"/><polygon fill="#2F5D8A" points="950.87,102.7328,941.5913,99.4304,945.8845,103.1139,942.2011,107.4071,950.87,102.7328" style="stroke:#2F5D8A;stroke-width:1.0;"/><path d="M589,45.8628 L589,100.8628 L916,100.8628 L916,55.8628 L906,45.8628 L589,45.8628 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.5;"/><path d="M906,45.8628 L906,55.8628 L916,55.8628 L906,45.8628 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="306" x="595" y="62.9297">El servicio de WhatsApp/LLM (Node.js + Baileys)</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="256" x="595" y="78.0625">lee los grupos con un n&#250;mero dedicado,</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="139" x="595" y="93.1953">en modo solo lectura.</text></g><!--link CU06 to LLM--><g id="link_CU06_LLM"><path d="M448.32,195.1328 C487.05,210.6128 537.33,228.0028 584,235.8628 C715.77,258.0428 867.3286,248.5678 951.3286,240.3378 " fill="none" id="CU06-to-LLM" style="stroke:#2F5D8A;stroke-width:1.0;"/><polygon fill="#2F5D8A" points="957.3,239.7528,947.9529,236.6494,952.3238,240.2403,948.7329,244.6113,957.3,239.7528" style="stroke:#2F5D8A;stroke-width:1.0;"/><path d="M609.5,145.8628 L609.5,230.8628 L895.5,230.8628 L895.5,155.8628 L885.5,145.8628 L609.5,145.8628 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.5;"/><path d="M885.5,145.8628 L885.5,155.8628 L895.5,155.8628 L885.5,145.8628 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="265" x="615.5" y="162.9297">Recibe los mensajes pendientes por lotes</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="246" x="615.5" y="178.0625">cada 5 minutos (solo si hay mensajes)</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="256" x="615.5" y="193.1953">e identifica surtidor, tipo de combustible</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="248" x="615.5" y="208.3281">("Desconocido" si no se indica), estado</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="156" x="615.5" y="223.4609">y, si se menciona, la fila.</text></g><rect fill="#FFF8E1" height="107.7813" id="_legend" rx="7.5" ry="7.5" style="stroke:#C9A227;stroke-width:1.0;" width="441" x="318.5" y="295.0625"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="387" x="323.5" y="311.2012">Disparador: llega un mensaje nuevo a un grupo monitoreado;</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="281" x="323.5" y="325.1699">se analiza en el siguiente ciclo de 5 minutos.</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="424" x="323.5" y="339.1387">El backend Java valida el resultado contra el cat&#225;logo de surtidores</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="259" x="323.5" y="353.1074">y el estado queda disponible para CU-05.</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="431" x="323.5" y="367.0762">Es una de las dos fuentes autom&#225;ticas del estado de los surtidores;</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="230" x="323.5" y="381.0449">la otra es la consulta a ANH (CU-09).</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="367" x="323.5" y="395.0137">Decisi&#243;n de arquitectura: decision_conexion_whatsapp.md</text><!--SRC=[dLLDKnj74Btlh-YI3vOgV0Wb4C0kgcH0Jb8sbJB1NAXojNP7Oc1sPfcP5PPJ-J7-0Jdvbgl-M5xFIaWGaOCvm38zx_NhDpqzB-duOhExTqZldTNHUSMUJaFamb6XwBpsKHTO3JIP_SrqUSqnzAigUqc3Mjce3gdR- -JL7Mq2LQbSZtJEkPvzim8_vk22V5m4Hsr9j4ES4XvqGF5h23KO_jZizWwe_MA_yueuZpKR_KNoAokXdtQfhJv7ptb3cpjBRrWRDGqq9RQphqO77QXodeoBK2exthrxBna-g0c2SpMvkrPUsLmpjRjxsplTxLwtjzSvfA3yHESwLRoeS1iC6nHrvHfeEQn3r4EZo0sD7ZEi0c1A8ssON0MqPRELPKQD8aL7Ne-l8nNQgpmYbeLRRIlsN5AuHd7tsevfn2QebKYXHboRE70sdd6fg7MYRlXZJUTiGslzldFzHT7EZol1YlDR7glpE8LMoSvsR5Qpm6Bdcp3Vg-3ArM0TLCv1qPyPmUNyTknTROjZP-3kYzF-e3Tu8n7d2-Ndgxt1xib-7wjzxztzuyM_LgWVj3JaQobIIKdQq9dY4Jp9_X_eVzGEqiyZ3el-M5yQTkwVxZmbFpxezte_Fw9OK-GoQDHOsU8xCimhJuVPGxuiwWWJlkjgPerJhT-zot6yihUS4xWhs-OwkdBsDUhSTLh4OS5EhrzN3UBeQ47nrjTLSu4Nx5TsmGKP8U4l-u3Y1aPLCk6cAczNAA1YeXHqWiN8jKmO_5qBofPDqX87nKsP8zUrTnyrtoX