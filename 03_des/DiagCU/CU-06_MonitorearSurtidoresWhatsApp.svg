 L583,45.8628 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.5;"/><path d="M909,45.8628 L909,55.8628 L919,55.8628 L909,45.8628 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="315.4658" x="589" y="62.9297">El servicio de WhatsApp/LLM (Node.js + Baileys)</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="261.3774" x="589" y="78.0625">lee los grupos con un n&#250;mero dedicado,</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="141.2861" x="589" y="93.1953">en modo solo lectura.</text></g><!--link CU06 to LLM--><g id="link_CU06_LLM"><path d="M445.19,195.4928 C483.21,210.8828 532.33,228.0628 578,235.8628 C713.67,259.0328 870.1296,248.9779 955.8096,240.4379 " fill="none" id="CU06-to-LLM" style="stroke:#2F5D8A;stroke-width:1.0;"/><polygon fill="#2F5D8A" points="961.78,239.8428,952.4276,236.7552,956.8047,240.3387,953.2211,244.7157,961.78,239.8428" style="stroke:#2F5D8A;stroke-width:1.0;"/><path d="M605.5,145.8628 L605.5,230.8628 L896.5,230.8628 L896.5,155.8628 L886.5,145.8628 L605.5,145.8628 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.5;"/><path d="M886.5,145.8628 L886.5,155.8628 L896.5,155.8628 L886.5,145.8628 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="270.5054" x="611.5" y="162.9297">Recibe los mensajes pendientes por lotes</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="249.7168" x="611.5" y="178.0625">cada 5 minutos (solo si hay mensajes)</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="264.2847" x="611.5" y="193.1953">e identifica surtidor, tipo de combustible</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="254.1538" x="611.5" y="208.3281">("Desconocido" si no se indica), estado</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="161.0718" x="611.5" y="223.4609">y, si se menciona, la fila.</text></g><rect fill="#FFF8E1" height="79.8438" id="_legend" rx="7.5" ry="7.5" style="stroke:#C9A227;stroke-width:1.0;" width="415.123" x="334.6772" y="295.0625"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="371.1738" x="339.6772" y="311.2012">Disparador: llega un mensaje nuevo a un grupo monitoreado;</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="269.8945" x="339.6772" y="325.1699">se analiza en el siguiente ciclo de 5 minutos.</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="405.123" x="339.6772" y="339.1387">El backend Java valida el resultado contra el cat&#225;logo de surtidores</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="248.2031" x="339.6772" y="353.1074">y el estado queda disponible para CU-05.</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="352.916" x="339.6772" y="367.0762">Decisi&#243;n de arquitectura: decision_conexion_whatsapp.md</text><!--SRC=[dLN1SXf74BtlLtJXWw4C215BaR5BLHY9L5AsAsL5reKgLxFRB2FDpgncPf5nAX_Z3yZ9jrpviNJF0a8Aoi4S19gUzxhxJS-Rvp2wxFIE1_3U6XMi8tHmxWDc5ZA2Yye5bV6gXyNgRuIhEGO_BClaEOmhCe46qEj_TdGB7KQLbAgPIZ5Lg-z6u2FqrikFIs-XAOaE0MF2anPJ_EfznGn_T7hzLz1yTj9w3PY62hNwAld9IEZb4JJfIt2OrhIfDV0MbQQbXoMWMNtJoYiFfNMWRU1APSUxT-ybmqTQS71TJMhdvCYa2g7PEpuux1tqU_tZrW0ykOLALUnuq-41CxGXgDBMq69Q-Q2cci1EjSgHfMB04cPA8zYIqGPrDqaqpG842qxbym2PSfG6ZYN-HfaI7HRWvzpSdJ8vp51xsebaDCDAXx4ruGCM18qpkiPF5LoWyOtz-oxKLuB3dtQ29QOtcDD5M7AjaXrDhdUpiCJMrM6y8s-BtM3bAKLFy6S2h79wapjRcMnaDQlxx7muxe_VIiIwZDnwjJy-EZiPykhGENltSF6l7UfjBJNvNehOKYnjQdN