<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="316px" preserveAspectRatio="none" style="width:1072px;height:316px;background:#FFFFFF;" version="1.1" viewBox="0 0 1072 316" width="1072px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="413" x="322.5" y="22.9951">CU-09: Consultar Estado de Combustible desde ANH</text><!--cluster Backend de ChuroViaje (m?dulo de combustible)--><g id="cluster_Backend de ChuroViaje (m&#243;dulo de combustible)"><rect fill="none" height="120" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:1.0;" width="380" x="182" y="64.2969"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="364" x="190" y="78.3638">Backend de ChuroViaje (m&#243;dulo de combustible)</text></g><g id="elem_CU09"><ellipse cx="371.7939" cy="133.3984" fill="#EAF2FB" rx="121.7939" ry="35.1015" style="stroke:#2F5D8A;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="40" x="351.7939" y="120.7661">CU-09</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="129" x="307.2939" y="135.8989">Consultar Estado de</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="156" x="293.7939" y="151.0317">Combustible desde ANH</text></g><!--entity Consulta--><g id="elem_Consulta"><ellipse cx="70.5" cy="111.9297" fill="#FFFFFF" rx="16" ry="16" style="stroke:#2F5D8A;stroke-width:0.5;"/><path d="M70.5,131.9297 C74.5,131.9297 77.5,131.9297 81.5,127.9297 C89.5,127.9297 97.5,135.9297 97.5,143.9297 L97.5,147.9297 C97.5,151.9297 93.5,155.9297 89.5,155.9297 L51.5,155.9297 C47.5,155.9297 43.5,151.9297 43.5,147.9297 L43.5,143.9297 C43.5,135.9297 51.5,127.9297 59.5,127.9297 C63.5,131.9297 66.5,131.9297 70.5,131.9297 " fill="#FFFFFF" style="stroke:#2F5D8A;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="129" x="6" y="168.4966">Proceso de consulta</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="128" x="6" y="183.6294">a ANH (autom&#225;tico)</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="67" x="37" y="92.3638">&#171;proceso&#187;</text></g><!--entity ANH--><g id="elem_ANH"><ellipse cx="1004.5" cy="111.9297" fill="#FFFFFF" rx="16" ry="16" style="stroke:#2F5D8A;stroke-width:0.5;"/><path d="M1004.5,131.9297 C1008.5,131.9297 1011.5,131.9297 1015.5,127.9297 C1023.5,127.9297 1031.5,135.9297 1031.5,143.9297 L1031.5,147.9297 C1031.5,151.9297 1027.5,155.9297 1023.5,155.9297 L985.5,155.9297 C981.5,155.9297 977.5,151.9297 977.5,147.9297 L977.5,143.9297 C977.5,135.9297 985.5,127.9297 993.5,127.9297 C997.5,131.9297 1000.5,131.9297 1004.5,131.9297 " fill="#FFFFFF" style="stroke:#2F5D8A;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="73" x="954.5" y="168.4966">API de ANH</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="100" x="954.5" y="183.6294">Abastecimiento</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="121" x="944" y="92.3638">&#171;sistema externo&#187;</text></g><!--link Consulta to CU09--><g id="link_Consulta_CU09"><path d="M135.02,133.2969 C168.41,133.2969 204.49,133.2969 243.84,133.2969 " fill="none" id="Consulta-to-CU09" style="stroke:#2F5D8A;stroke-width:1.0;"/><polygon fill="#2F5D8A" points="249.84,133.2969,240.84,129.2969,244.84,133.2969,240.84,137.2969,249.84,133.2969" style="stroke:#2F5D8A;stroke-width:1.0;"/></g><!--link CU09 to ANH--><g id="link_CU09_ANH"><path d="M494.19,133.2969 C628.87,133.2969 834.88,133.2969 937.66,133.2969 " fill="none" id="CU09-to-ANH" style="stroke:#2F5D8A;stroke-width:1.0;"/><polygon fill="#2F5D8A" points="943.66,133.2969,934.66,129.2969,938.66,133.2969,934.66,137.2969,943.66,133.2969" style="stroke:#2F5D8A;stroke-width:1.0;"/><path d="M583,43.2969 L583,128.2969 L909,128.2969 L909,53.2969 L899,43.2969 L583,43.2969 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.5;"/><path d="M899,43.2969 L899,53.2969 L909,53.2969 L899,43.2969 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="292" x="589" y="60.3638">Solo lecturas GET por HTTPS, sin credenciales</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="283" x="589" y="75.4966">y sin datos de personas. ANH devuelve todo</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="305" x="589" y="90.6294">el departamento de Tarija: el backend se queda</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="304" x="589" y="105.7622">solo con las estaciones vinculadas a un surtidor</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="268" x="589" y="120.895">del cat&#225;logo dentro de la mancha urbana.</text></g><rect fill="#FFF8E1" height="93.8125" id="_legend" rx="7.5" ry="7.5" style="stroke:#C9A227;stroke-width:1.0;" width="417" x="320.5" y="203.1294"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="351" x="325.5" y="219.2681">Disparador: se cumple el ciclo de consulta del backend.</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="316" x="325.5" y="233.2368">El backend valida la respuesta y traduce los litros:</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="385" x="325.5" y="247.2056">0 es agotado, m&#225;s de 0 es disponible y sin saldo es sin dato.</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="407" x="325.5" y="261.1743">Si ANH falla, cada surtidor conserva su &#250;ltimo dato con su fecha.</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="354" x="325.5" y="275.1431">El estado queda disponible para CU-05, con origen ANH.</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="359" x="325.5" y="289.1118">Es una de las dos fuentes autom&#225;ticas; la otra es CU-06.</text><!--SRC=[dLNTRff74Bt_dc94Bc9B1W6LtPXQbeWDJQGgiWJEbQLgs1tmslljalt1JQi-J9uXTxdbnJAp7yRGqaej5nRCxZbpvipi-3LStRQxvmEuyYvccp30A2RK7ZHnh9xbcCpC4l-C71b-U5UzXd4cbsW0tVwlWJv1co5BKcPk52gp_keA5gEFykKsUZYI93t09janKxoFCJF3jDthdS7HgrxtxBW3lo0OjoBEk7WXiWZ3c_V0qVKN85SWfmLoUjofAalp1Cb3C8lx1De4KibuLyL7uvOOi8Pup-Ky6RU0ETf8EoUQviWrZxrB7x0cQ5tJ0txCC44NMuVlJSpl1BqVTWwNg1vnGPFqcLsIxEWMTZSBgkH3SunF57szUvWZAOm4VrG0Rvbf4Nns-ifR7-3LQ3ZkZz_AYG-QmYRQ7vzUlnboT1Y2VzeF_hb3lTNIa1-aA2KLQJDlzHwyoFuNwD_KZijdZyFvz0-bySqtezvVoQ_EX_t-ZtiK1ufyERIq8AV_HuPDvQMPVSvN9PFOXF_y5gh6fTPDy8fRAnVL1dpdKAx04URaw_MNP9G_RW76BJrSN2mRtENbCv6CUiDzvuOpZ8dVLMtukVa25SABYsWuNYFGRuc24tJrqkoME26kYEZx7Fn7Wmy4H_Nwgyvs8t5R2oiIzvx7i5KSk7C7793W0GkQYcwxv-BYjh9s-x89of_oIzmgu-0TMECUEUc4My8jL2a7vlXvD8KbM_1kEhsPd40q3bGWJKuPj1Jv_kSIr9YQnRAa4Bt3s2ckQ5fbiYlYNQ0zNoRB8PwIn0-RtHF058Dvm84SpJOUSScVCcbaG1GrIjIn6Dusl86yemWhurIsg3cAa1t479BHFZ14CvD2talMBoI3Iy5lLbQDJjtp_J13XvrASadrig_AoCvyugbWZciJPPQPS21gLAwNRAyG6sNt1ggasmZlC7BqKiOAhT4eUGF5PHRrx5PYsgnO3ljb3MkB0uPrkJZ0XPUsdW0FPZ6pH3LhyQxqj_4wekNUyycpyP9tOehXl4mjdd3zdFZPawALmaeYiFvcawbzmHLZEJOdTcKZdfh9AlxlfXOxoaiyFIampwkTzpxdBC38JS36PLRCfStBVoEkQVlECFuaNdWsGCGBrrdfGMD-zHq0]--></g></svg>