services:
  db:
    image: postgis/postgis:16-3.6-alpine
    environment:
      POSTGRES_DB: churoviaje_dev
      POSTGRES_USER: churoviaje
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Se requiere DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - churoviaje_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churoviaje -d churoviaje_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  churoviaje_pgdata:
