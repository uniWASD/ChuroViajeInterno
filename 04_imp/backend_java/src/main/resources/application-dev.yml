spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:churoviaje_dev;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

churoviaje:
  seguridad:
    jwt-secret: ${JWT_SECRET:clave-temporal-solo-para-entorno-local-dev}
    credencial-servicio: ${SERVICE_CREDENTIAL:credencial-local-dev}
  llm:
    api-key: ${LLM_API_KEY:api-key-local-dev}