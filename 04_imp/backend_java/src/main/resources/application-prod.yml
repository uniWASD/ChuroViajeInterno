spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
churoviaje:
  cobertura:
    ruta: ${CHUROVIAJE_GEOJSON_PATH}
    permitir-provisional: false
