spring:
  datasource:
    url: jdbc:h2:mem:churoviaje_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

churoviaje:
  seguridad:
    jwt-secret: ${JWT_SECRET:clave-pruebas-automatizadas}
    credencial-servicio: ${SERVICE_CREDENTIAL:credencial-pruebas}
  llm:
    api-key: ${LLM_API_KEY:api-key-pruebas}