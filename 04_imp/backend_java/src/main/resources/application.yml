spring:
  application:
    name: churoviaje-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoint:
    health:
      show-details: never
churoviaje:
  cobertura:
    ruta: ${CHUROVIAJE_GEOJSON_PATH:../datos/mancha_urbana_tarija.geojson}
    permitir-provisional: false
