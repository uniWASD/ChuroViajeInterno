spring:
  application:
    name: churoviaje-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoint:
    health:
      show-details: never

motor:
  # El backend solo arranca el nucleo C++ si MOTOR_HABILITADO=true; apagado, las operaciones del motor responden 503.
  habilitado: ${MOTOR_HABILITADO:false}
  ejecutable: ${MOTOR_PATH:}
  red-vial: ${RED_VIAL_PATH:}
  tiempo-maximo: 3s
  espera-arranque: 60s
  espera-reinicio: 2s

churoviaje:
  cobertura:
    ruta: ${CHUROVIAJE_GEOJSON_PATH:../datos/mancha_urbana_tarija.geojson}
    permitir-provisional: false