spring:
  application:
    name: churoviaje-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoint:
    health:
      show-details: never

motor:
  # El backend solo arranca el nucleo C++ si MOTOR_HABILITADO=true; apagado, las operaciones del motor responden 503.
  habilitado: ${MOTOR_HABILITADO:false}
  ejecutable: ${MOTOR_PATH:}
  red-vial: ${RED_VIAL_PATH:}
  tiempo-maximo: 3s
  espera-arranque: 60s
  espera-reinicio: 2s

churoviaje:
  cobertura:
    ruta: ${CHUROVIAJE_GEOJSON_PATH:../datos/mancha_urbana_tarija.geojson}
    permitir-provisional: false
  lugares:
    # D-47: JSON de preparar_lugares.py, fuera del repositorio. Vacio: la busqueda solo encuentra surtidores.
    ruta: ${LUGARES_PATH:}
  seguridad:
    # Secretos solo por variables de entorno; sin valor por defecto en el repositorio (D-13).
    # Si falta alguno, el backend no arranca (PropiedadesSeguridad).
    jwt:
      secreto: ${JWT_SECRET:}
      duracion: 1h # RN-08.5, RN-08.12
    renovacion:
      duracion: 30d # RN-08.12
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    credencial-servicio: ${SERVICE_CREDENTIAL:}
  # CU-09 (HU-14): la consulta a ANH. Valores de partida de T-117 (#112): P-29, cada 10 minutos (nunca menos);
  # P-32, 12 s por peticion, 1 reintento y 1 s entre peticiones. La base es siempre HTTPS (RN-09.3).
  anh:
    habilitada: ${ANH_HABILITADA:true}
    base: https://abastecimiento.prod.anh.gob.bo/api/
    ciclo: PT10M
    espera-inicial: PT2M
    espera-peticion: PT12S
    reintentos: 1
    pausa: PT1S
  # CU-07 y P-20: sesiones de prueba para el simulador y modo demostracion. Apagados aqui y siempre en `prod`;
  # solo el perfil `pruebas` los enciende (SimulacionAmbiente).
  simulacion:
    credencial: ""
    demostracion: false
    # Archivo donde se anota cada prueba de carga (RN-07.11). Vacio: solo va al registro del backend.
    registro: ""
