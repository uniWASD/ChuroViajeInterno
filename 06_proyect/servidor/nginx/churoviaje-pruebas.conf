# Sitio de Nginx del ambiente de pruebas del simulador (T-106, #86)
# Copia de /etc/nginx/sites-available/churoviaje-pruebas en churoviaje-server, antes de certbot.
# certbot --nginx agrega el bloque del 443 y la redirección de HTTP a HTTPS, igual que en churoviaje.conf.
# Pasa las peticiones al backend de pruebas, que solo escucha en 127.0.0.1:8090.

server {
    listen 80;
    server_name pruebas.churoviaje.orelqu.com;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
