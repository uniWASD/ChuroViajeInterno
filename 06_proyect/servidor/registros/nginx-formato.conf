# Formato del registro de acceso de Nginx (T-103, #79). Copia de /etc/nginx/conf.d/churoviaje-formato.conf.
# No guarda la consulta de las URL ($uri en lugar de $request): en GET /surtidores y GET /lugares lleva la
# ubicación del conductor. Tampoco guarda la IP completa: el último bloque de una IPv4 queda en 0 y de una IPv6
# solo quedan los dos primeros grupos. Sin referer, que podría traer otra consulta.
map $remote_addr $ip_anonima {
    ~^(?<red>\d+\.\d+\.\d+)\.\d+$   $red.0;
    ~^(?<red>[0-9a-fA-F]+:[0-9a-fA-F]+):   $red::;
    default                          0.0.0.0;
}

log_format churoviaje_sin_consulta '$ip_anonima [$time_local] "$request_method $uri $server_protocol" '
                                   '$status $body_bytes_sent $request_time "$http_user_agent"';
