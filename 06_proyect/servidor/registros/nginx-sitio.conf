# Lo que cada bloque server de ChuroViaje incluye (T-103, #79). Copia de /etc/nginx/snippets/churoviaje-registro.conf.
# El registro de errores queda en «crit»: en los niveles más bajos Nginx copia la línea de la petición con su
# consulta, y con ella la ubicación del conductor. Los errores del backend quedan en su propio registro.
access_log /var/log/nginx/access.log churoviaje_sin_consulta;
error_log /var/log/nginx/error.log crit;
